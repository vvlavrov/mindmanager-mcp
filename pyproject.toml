[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mindmanager-mcp"
version = "0.1.0"
description = "Full-featured Model Context Protocol (MCP) server for Mindjet MindManager automation, task roadmaps, and diagramming"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Viacheslav Lavrov", email = "aftmlavrov@gmail.com" }
]
dependencies = [
    "pywin32>=306",
    "fastmcp>=0.4.0",
    "pydantic>=2.0.0"
]

[project.scripts]
mindmanager-mcp = "src.server:mcp.run"
